<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription - FES Festival</title>
  </head>

  <body>
    <header>
      <h1>Inscription au Festival</h1>
      <h2>L'Olive au Cœur - 2026</h2>

      <nav>
        <a href="index.html">Accueil</a> |
        <a href="programme.html">Programme</a> |
        <a href="inscription.html">Inscription</a>
      </nav>
    </header>

    <hr />

    <main>
      <h2>Formulaire d'inscription</h2>

      <p>
        Remplissez ce formulaire pour participer au FES Festival L'Olive au Cœur
        2026.
      </p>

      <form action="#" method="post">
        <label for="nom">Nom :</label>
        <br />
        <input type="text" id="nom" name="nom" required />
        <br /><br />

        <label for="prenom">Prénom :</label>
        <br />
        <input type="text" id="prenom" name="prenom" required />
        <br /><br />

        <label for="email">Adresse e-mail :</label>
        <br />
        <input type="email" id="email" name="email" required />
        <br /><br />

        <label for="telephone">Téléphone :</label>
        <br />
        <input type="tel" id="telephone" name="telephone" required />
        <br /><br />

        <label for="date">Date de participation :</label>
        <br />
        <input type="date" id="date" name="date" />
        <br /><br />

        <label for="activite">Activité souhaitée :</label>
        <br />

        <select id="activite" name="activite">
          <option value="">Choisissez une activité</option>
          <option value="ateliers">Ateliers</option>
          <option value="conference">Conférences</option>
          <option value="spectacle">Spectacles</option>
          <option value="sport">Activités sportives</option>
          <option value="gastronomie">Gastronomie</option>
        </select>

        <br /><br />

        <label for="message">Message :</label>
        <br />
        <textarea id="message" name="message" rows="5" cols="30"></textarea>

        <br /><br />

        <input type="checkbox" id="conditions" required />
        <label for="conditions">
          J'accepte les conditions d'inscription.
        </label>

        <br /><br />

        <input type="submit" value="S'inscrire" />
        <input type="reset" value="Effacer" />
      </form>
    </main>

    <hr />

    <footer>
      <p>FES Festival L'Olive au Cœur - 2026</p>
      <a href="indix1.html">Retour à l'accueil</a>
    </footer>
  </body>
</html>
